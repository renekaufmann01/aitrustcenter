            };

                if (origin === "Internal Innovation") return "bg-blue-50 text-blue-700 border-blue-200";
                return "bg-teal-50 text-teal-700 border-teal-200";

                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">

                                    <label className="block font-bold text-slate-700 mb-1">Compliance Deadline *</label>
                                    <select 
                                        className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white outline-none"
                                        value={formData.complianceDeadline} onChange={e => setFormData({...formData, complianceDeadline: e.target.value})}
                                    >
                                        <option value="August 2025">August 2025 (GPAI Target)</option>
                                        <option value="August 2026">August 2026 (High-Risk Binding)</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 mb-1">Foundation GPAI Model *</label>
                                <input 
                                    type="text" required 
                                    placeholder="e.g. AWS Bedrock Claude 3.5 Sonnet / Azure OpenAI GPT-4o"
                                    className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white outline-none"
                                    value={formData.gpaiModel} onChange={e => setFormData({...formData, gpaiModel: e.target.value})}
                                />
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 mb-1">Article 14 Qualified HITL *</label>
                                <input 
                                    type="text" required 
                                    placeholder="e.g. Certified QC Manager Sign-off"
                                    className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white outline-none"
                                    value={formData.qualifiedHitl} onChange={e => setFormData({...formData, qualifiedHitl: e.target.value})}
                                />
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 mb-1">Business Impact Summary *</label>
                                <textarea 
                                    rows="2" required 
                                    placeholder="Quantifiable outcome, e.g. Accelerates throughput by 60%..."
                                    className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white outline-none"
                                    value={formData.impact} onChange={e => setFormData({...formData, impact: e.target.value})}
                                />
                            </div>

                            <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl font-semibold">Cancel</button>
                                <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-all shadow-sm">
                                    Register Blueprint
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [blueprints, setBlueprints] = useState(initialBlueprints);
            const [searchTerm, setSearchTerm] = useState("");
            const [riskFilter, setRiskFilter] = useState("All");
            const [originFilter, setOriginFilter] = useState("All");
            const [roleFilter, setRoleFilter] = useState("All");
            const [selectedBlueprint, setSelectedBlueprint] = useState(null);
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [showCopiedNotification, setShowCopiedNotification] = useState(false);

            const filteredData = useMemo(() => {
                return blueprints.filter(bp => {
                    const matchesSearch = bp.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                          bp.impact.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          bp.gpaiModel.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesRisk = riskFilter === "All" || bp.risk === riskFilter;
                    const matchesOrigin = originFilter === "All" || bp.origin === originFilter;
                    const matchesRole = roleFilter === "All" || bp.supplyChainRole === roleFilter;
                    return matchesSearch && matchesRisk && matchesOrigin && matchesRole;
                });
            }, [blueprints, searchTerm, riskFilter, originFilter, roleFilter]);

            // Metrics calculation
            const stats = useMemo(() => {
                const total = blueprints.length;
                const highRisk = blueprints.filter(b => b.risk.includes("High")).length;
                const aideateCount = blueprints.filter(b => b.origin === "AiDEATE Program").length;
                const providerCount = blueprints.filter(b => b.supplyChainRole.includes("Provider")).length;
                return { total, highRisk, aideateCount, providerCount };
            }, [blueprints]);

            const handleAddBlueprint = (newBp) => {
                setBlueprints(prev => [newBp, ...prev]);
            };

            const copySowDisclosure = () => {
                const text = `ZIFO AI DISCLOSURE STATEMENT (ACME CoC & EU AI Act Compliant)\n` +
                    `Total Registered Blueprints: ${blueprints.length}\n` +
                    `High Risk Systems (Annex III GxP): ${stats.highRisk}\n` +
                    `All tools implement Article 14 Qualified Human-in-the-Loop Oversight, Immutable Audit Trails, and Transparent Efficiency Pass-Backs.\n` +
                    `Maintained by: René Kaufmann, Head of Strategy Consulting Europe.`;
                document.execCommand('copy');
                setShowCopiedNotification(true);
                setTimeout(() => setShowCopiedNotification(false), 3000);
            };

            const getRiskBadgeColor = (risk) => {
                if (risk.includes("High")) return "text-red-700 bg-red-50 border-red-200";
                if (risk.includes("Medium")) return "text-amber-700 bg-amber-50 border-amber-200";
                return "text-emerald-700 bg-emerald-50 border-emerald-200";
            };

            const getOriginBadgeColor = (origin) => {
                if (origin === "AiDEATE Program") return "bg-purple-50 text-purple-700 border-purple-200";
                if (origin === "Internal Innovation") return "bg-blue-50 text-blue-700 border-blue-200";
                return "bg-teal-50 text-teal-700 border-teal-200";
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header Banner */}
                    <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-600/30">
                                    <SVGIcon name="shield-check" size={24} />
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-lg font-bold tracking-tight">ZIFO AI BLUEPRINT REGISTRY</h1>
                                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                                            EU AI Act Ready
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400 font-medium">Strategy & Compliance Target Operating Model • René Kaufmann</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2.5">
                                <button 
                                    onClick={copySowDisclosure}
                                    className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition-all border border-slate-700 flex items-center gap-1.5"
                                >
                                    <SVGIcon name="copy" size={14} /> Copy SOW AI Disclosure
                                </button>
                                <button 
                                    onClick={() => setIsAddModalOpen(true)}
                                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-1.5"
                                >
                                    <SVGIcon name="plus" size={14} /> Add Blueprint
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Copied Notification toast */}
                    {showCopiedNotification && (
                        <div className="bg-emerald-600 text-white text-xs font-bold py-2 text-center transition-all animate-fadeIn">
                            ✓ SOW AI Disclosure copied to clipboard for proposal attachment!
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
                        
                        {/* Executive Summary Stats */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                            <StatCard iconName="layers" iconColor="text-indigo-500" label="Registered Blueprints" value={stats.total} subtext="Centralized AI Portfolio" />
                            <StatCard iconName="shield-alert" iconColor="text-red-500" label="High Risk (Annex III)" value={stats.highRisk} subtext="Mandatory QMS & Art. 14 HITL" />
                            <StatCard iconName="sparkles" iconColor="text-purple-500" label="Origin: AiDEATE PoCs" value={stats.aideateCount} subtext="Strategic AI Program" />
                            <StatCard iconName="file-text" iconColor="text-emerald-500" label="Role: Provider / Co-Dev" value={stats.providerCount} subtext="Strict 10-Yr Tech Doc Retention" />
                        </div>

                        {/* Search & Multi-Filter Control Bar */}
                        <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm mb-8 space-y-4 md:space-y-0 md:flex md:items-center md:justify-between md:gap-4">
                            {/* Search */}
                            <div className="relative flex-1">
                                <div className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
                                    <SVGIcon name="search" size={16} />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="Search by blueprint name, model, or impact..." 
                                    className="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>

                            {/* Dropdown Filters */}
                            <div className="flex flex-wrap items-center gap-2 text-xs">
                                {/* Risk Filter */}
                                <div className="flex items-center gap-1.5 bg-slate-50 px-2.5 py-1.5 rounded-xl border border-slate-200">
                                    <span className="font-bold text-slate-500 text-[11px]">Risk:</span>
                                    <select 
                                        className="bg-transparent font-semibold text-slate-800 outline-none cursor-pointer"
                                        value={riskFilter} onChange={e => setRiskFilter(e.target.value)}
                                    >
                                        <option value="All">All Risk Classes</option>
                                        <option value="High Risk">High Risk</option>
                                        <option value="Medium-High">Medium-High</option>
                                        <option value="Limited Risk">Limited Risk</option>
                                    </select>
                                </div>

                                {/* Origin Filter */}
                                <div className="flex items-center gap-1.5 bg-slate-50 px-2.5 py-1.5 rounded-xl border border-slate-200">
                                    <span className="font-bold text-slate-500 text-[11px]">Origin:</span>
                                    <select 
                                        className="bg-transparent font-semibold text-slate-800 outline-none cursor-pointer"
                                        value={originFilter} onChange={e => setOriginFilter(e.target.value)}
                                    >
                                        <option value="All">All Origins</option>
                                        <option value="AiDEATE Program">AiDEATE Program</option>
                                        <option value="Internal Innovation">Internal Innovation</option>
                                        <option value="Client Delivery">Client Delivery</option>
                                    </select>
                                </div>

                                {/* Role Filter */}
                                <div className="flex items-center gap-1.5 bg-slate-50 px-2.5 py-1.5 rounded-xl border border-slate-200">
                                    <span className="font-bold text-slate-500 text-[11px]">Role:</span>
                                    <select 
                                        className="bg-transparent font-semibold text-slate-800 outline-none cursor-pointer"
                                        value={roleFilter} onChange={e => setRoleFilter(e.target.value)}
                                    >
                                        <option value="All">All Roles</option>
                                        <option value="Deployer">Deployer</option>
                                        <option value="Provider / Deployer">Provider / Deployer</option>
                                        <option value="Provider / Co-Provider">Provider / Co-Provider</option>
                                    </select>
                                </div>

                                {(riskFilter !== "All" || originFilter !== "All" || roleFilter !== "All" || searchTerm) && (
                                    <button 
                                        onClick={() => { setRiskFilter("All"); setOriginFilter("All"); setRoleFilter("All"); setSearchTerm(""); }}
                                        className="text-indigo-600 hover:text-indigo-800 font-bold px-2 py-1"
                                    >
                                        Reset
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Blueprints Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filteredData.map((bp) => (
                                <div 
                                    key={bp.id} 
                                    className="bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all flex flex-col justify-between group overflow-hidden"
                                >
                                    <div className="p-6">
                                        {/* Top Badges */}
                                        <div className="flex flex-wrap gap-1.5 mb-3">
                                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${getRiskBadgeColor(bp.risk)}`}>
                                                {bp.risk}
                                            </span>
                                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${getOriginBadgeColor(bp.origin)}`}>
                                                {bp.origin}
                                            </span>
                                        </div>

                                        {/* Title */}
                                        <h2 className="text-base font-bold text-slate-900 group-hover:text-indigo-600 transition-colors line-clamp-1 mb-2">
                                            {bp.name}
                                        </h2>
                                        <p className="text-xs text-slate-500 line-clamp-2 leading-relaxed mb-4">
                                            {bp.impact}
                                        </p>

                                        {/* Parameters Highlights Grid */}
                                        <div className="space-y-2 pt-3 border-t border-slate-100 text-[11px]">
                                            <div className="flex justify-between items-center">
                                                <span className="text-slate-400 font-medium">Supply Chain Role:</span>
                                                <span className="font-semibold text-slate-700 bg-slate-100 px-2 py-0.5 rounded">{bp.supplyChainRole}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-slate-400 font-medium">GPAI Foundation:</span>
                                                <span className="font-semibold text-slate-700 truncate max-w-[150px]">{bp.gpaiModel}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-slate-400 font-medium">Enforcement Target:</span>
                                                <span className="font-bold text-indigo-600">{bp.complianceDeadline}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Action Footer */}
                                    <div className="px-6 py-3 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
                                        <span className="text-[10px] font-mono text-slate-400">{bp.id}</span>
                                        <button 
                                            onClick={() => setSelectedBlueprint(bp)}
                                            className="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 transition-all"
                                        >
                                            Inspect Full Schema <SVGIcon name="arrow-right" size={14} />
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {filteredData.length === 0 && (
                            <div className="py-16 text-center bg-white rounded-3xl border border-dashed border-slate-300">
                                <div className="text-slate-400 mb-2 flex justify-center"><SVGIcon name="x" size={36} /></div>
                                <h3 className="text-sm font-bold text-slate-700">No matching Blueprints found</h3>
                                <p className="text-xs text-slate-500 mt-1">Try resetting search or filter options.</p>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 text-white border-t border-slate-800 py-8">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 text-center space-y-2">
                            <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">
                                Zifo Strategy & Delivery Workstream • AI Governance Target Operating Model
                            </p>
                            <p className="text-[11px] text-slate-500 max-w-xl mx-auto">
                                Tailored for Life Sciences R&D, GxP Compliance, EU AI Act Enforcement (2025/2026), and Client Supplier Codes of Practice (e.g. ACME CoC).
                            </p>
                        </div>
                    </footer>

                    {/* Modals */}
                    <BlueprintModal bp={selectedBlueprint} onClose={() => setSelectedBlueprint(null)} />
                    <AddBlueprintModal isOpen={isAddModalOpen} onClose={() => setIsAddModalOpen(false)} onAdd={handleAddBlueprint} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
